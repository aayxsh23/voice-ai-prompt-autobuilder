                                                                    <input className="input-field text-[13px]" value={inf.name} onChange={(e) => updateInfield(i, 'name', e.target.value)} placeholder="e.g. customer_name" />
                                                                </div>
                                                                <div className="w-full sm:w-1/3">
                                                                    <Label>Type</Label>
                                                                    <select className="input-field text-[13px]" value={inf.type} onChange={(e) => updateInfield(i, 'type', e.target.value)}>
                                                                        <option value="string">string</option>
                                                                        <option value="number">number</option>
                                                                        <option value="boolean">boolean</option>
                                                                    </select>
                                                                </div>
                                                            </div>
                                                            <div>
                                                                <Label>Description</Label>
                                                                <textarea className="input-field resize-y text-[13px] bg-canvas/30" rows={2} value={inf.description} onChange={(e) => updateInfield(i, 'description', e.target.value)} placeholder="Describe what this variable tracks..." maxLength={1000} />
                                                            </div>
                                                        </div>
                                                    </CompactRow>
                                                ))}
                                                {ed.infields.length === 0 && (
                                                    <div className="card p-10 bg-white text-center border-dashed shadow-sm">
                                                        <LIcon name="clipboard-list" className="w-8 h-8 text-line-strong mx-auto mb-3" />
                                                        <p className="text-[14px] text-graphite mb-1">No variables defined.</p>
                                                        <p className="text-[13px] text-faint">Add variables to pass dynamic data to your agent.</p>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    )}

                                    {activeEditorTab === 'outcomes' && (
                                        <div className="space-y-6 animate-fade-in">
                                            <div className="flex items-center justify-between">
                                                <div>
                                                    <h2 className="text-[18px] font-semibold text-ink mb-1">Call Outcomes</h2>
                                                    <p className="text-[13px] text-graphite mb-6">Information to extract from the call transcript after hanging up.</p>
                                                </div>
                                                <div className="flex items-center gap-3">
                                                    <button className="btn btn-secondary bg-white"><LIcon name="upload-cloud" className="w-4 h-4" /> CSV</button>
                                                    <button className="btn btn-secondary bg-white" onClick={addOutcome}><LIcon name="plus" className="w-4 h-4" /> Add Outcome</button>
                                                </div>
                                            </div>
                                            
                                            <div className="space-y-3">
                                                {ed.outcomes.map((out, i) => (
                                                    <CompactRow key={out.id} onRemove={() => removeOutcome(i)} onMoveUp={() => moveOutcome(i, -1)} onMoveDown={() => moveOutcome(i, 1)}>
                                                        <div className="flex flex-col gap-4 py-1">
                                                            <span className="text-[11px] font-semibold text-graphite uppercase tracking-wider">Outcome {i + 1}</span>
                                                            <div className="flex flex-col sm:flex-row gap-3">
                                                                <div className="flex-1">
                                                                    <Label>Name</Label>
                                                                    <input className="input-field text-[13px]" value={out.name} onChange={(e) => updateOutcome(i, 'name', e.target.value)} placeholder="e.g. appointment_booked" />
                                                                </div>
                                                                <div className="w-full sm:w-1/3">
                                                                    <Label>Type</Label>
                                                                    <select className="input-field text-[13px]" value={out.type} onChange={(e) => updateOutcome(i, 'type', e.target.value)}>
                                                                        <option value="string">string</option>
                                                                        <option value="number">number</option>
                                                                        <option value="boolean">boolean</option>
                                                                    </select>
                                                                </div>
                                                            </div>
                                                            <div>
                                                                <Label>Extraction Instructions</Label>
                                                                <div className="relative mt-1">
                                                                    <div className="absolute left-0 top-0 bottom-0 w-1 bg-accent rounded-l"></div>
                                                                    <textarea className="input-field resize-y text-[13px] pl-4 bg-canvas/30" rows={3} value={out.description} onChange={(e) => updateOutcome(i, 'description', e.target.value)} placeholder="Provide detailed extraction instructions for this outcome..." maxLength={4000} />
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </CompactRow>
                                                ))}
                                                {ed.outcomes.length === 0 && (
                                                    <div className="card p-10 bg-white text-center border-dashed shadow-sm">
                                                        <LIcon name="check-square" className="w-8 h-8 text-line-strong mx-auto mb-3" />
                                                        <p className="text-[14px] text-graphite mb-1">No outcomes defined.</p>
                                                        <p className="text-[13px] text-faint">Add outcomes to parse unstructured conversations into structured data.</p>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    )}

                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (stage === 'review') {
                const answered = questions.filter((_, i) => answers[i]?.trim());
                return (
                    <div className="w-full max-w-3xl mx-auto px-6 py-10 pb-28">
                        <div className="flex flex-wrap items-start justify-between gap-4 mb-8">
                            <div>
                                <h1 className="text-[20px] font-semibold text-ink mb-1">Final review</h1>
                                <p className="text-[14px] text-graphite">Edit anything here before we compile. Changes are saved into the build.</p>
                            </div>
                            <button type="button" className="btn btn-secondary" onClick={() => setStage('form')}>
                                <LIcon name="arrow-left" className="w-4 h-4" /> Back to builder
                            </button>
                        </div>

                        <div className="card mb-4 p-5">
                            <h2 className="text-[16px] font-semibold text-ink mb-4">Persona</h2>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-4">
                                <ReviewField label="Company name" rows={1} value={data.companyName} onChange={(v) => setData((d) => ({ ...d, companyName: v }))} />
                                <ReviewField label="Agent name" rows={1} value={data.agentName} onChange={(v) => setData((d) => ({ ...d, agentName: v }))} />
                            </div>
                            <ReviewField label="Call purpose" rows={3} value={data.callPurpose} onChange={(v) => setData((d) => ({ ...d, callPurpose: v }))} />
                            <div className="flex flex-wrap gap-x-6 gap-y-1 text-[13px] text-graphite pt-1">
                                <span>Direction: <span className="text-ink">{data.callDirection}</span></span>
                                <span>Industry: <span className="text-ink">{data.industry || '—'}</span></span>
                                <span>Region: <span className="text-ink">{data.region || 'Generic'}</span></span>
                                <span>Language: <span className="text-ink">{data.primaryLanguage}{data.secondaryLanguage !== 'None' ? ` + ${data.secondaryLanguage}` : ''}</span></span>
                                <span>Voice: <span className="text-ink">{data.voiceGender}</span></span>
                            </div>
                        </div>

                        <div className="card mb-4 p-5">
                            <h2 className="text-[16px] font-semibold text-ink mb-4">Conversation</h2>
                            <ReviewField label="Opening message" rows={3} value={data.openingMessage} onChange={(v) => setData((d) => ({ ...d, openingMessage: v }))} />
                            <ReviewField label="Call flow" rows={8} mono={true} value={data.callFlow} onChange={(v) => setData((d) => ({ ...d, callFlow: v }))} />
                            <ReviewStatic label="Pre-loaded customer data" value={data.variables.filter((v) => v.key.trim()).map((v) => `${v.key}${v.value ? ` = ${v.value}` : ''}`).join('\n')} />
                        </div>

                        <div className="card mb-4 p-5">
                            <h2 className="text-[16px] font-semibold text-ink mb-4">Knowledge base</h2>
                            {data.kbEnabled && data.kbContent.trim() ? (
                                <ReviewField label="Source content (facts get extracted into the prompt)" rows={8} value={data.kbContent} onChange={(v) => setData((d) => ({ ...d, kbContent: v }))} />
                            ) : (
                                <p className="text-[13px] text-graphite">Not provided — the agent will answer only from the persona and flow above.</p>
                            )}
                        </div>

                        <div className="card mb-4 p-5">
                            <h2 className="text-[16px] font-semibold text-ink mb-4">Guardrails &amp; call handling</h2>
                            <ReviewField label="Guardrails" rows={5} value={data.guardrails} onChange={(v) => setData((d) => ({ ...d, guardrails: v }))} />
                            <div className="flex flex-wrap gap-x-6 gap-y-1 text-[13px] text-graphite">
                                <span>AI disclosure: <span className="text-ink">{data.discloseAI ? 'Yes' : 'No'}</span></span>
                                <span>Recording consent: <span className="text-ink">{data.recordingConsent ? 'Yes' : 'No'}</span></span>
                                <span>Off-topic questions: <span className="text-ink">{data.digressionHandling}</span></span>
                                <span>If AI doesn't understand: <span className="text-ink">{data.retryFallback} after {data.maxRetries} attempts</span></span>
                            </div>
                            {data.liveTransferEnabled && (
                                <div className="mt-3">
                                    <ReviewStatic label="Live transfer" value={[
                                        ...data.transferNumbers.filter((t) => t.number.trim()).map((t) => `${t.label || 'Transfer'}: ${t.number}`),
                                        ...(data.transferTriggers.length ? [`Triggers: ${data.transferTriggers.join('; ')}`] : []),
                                        ...(data.afterHoursBehavior ? [`If unavailable: ${data.afterHoursBehavior}`] : []),
                                    ].join('\n')} />
                                </div>
                            )}
                        </div>

                        {questions.length > 0 && (
                            <div className="card mb-4 p-5">
                                <h2 className="flex items-center gap-2 text-[16px] font-semibold text-ink mb-4">
                                    <LIcon name="bot" className="h-4 w-4 text-graphite" /> Reviewer clarifications
                                </h2>
                                {answered.length === 0 && <p className="text-[13px] text-graphite mb-3">You skipped these — the system will use its own judgement.</p>}
                                {questions.map((q, i) => (
                                    <div key={i} className="mb-4">
                                        <p className="text-[13px] font-medium text-graphite mb-1.5">{i + 1}. {q}</p>
                                        <textarea className="input-field resize-y" rows={2} value={answers[i] || ''}
                                            placeholder="Your answer (optional)"
                                            onChange={(e) => setAnswers((a) => ({ ...a, [i]: e.target.value }))} />
                                    </div>
                                ))}
                            </div>
                        )}

                        <div className="card mb-4 p-5">
                            <button
                                type="button"
                                className="btn btn-secondary w-full"
                                onClick={() => setShowPreview(!showPreview)}
                            >
                                <LIcon name="eye" className="w-4 h-4" />
                                {showPreview ? 'Hide preview' : 'Preview compiled prompt'}
                            </button>
                            {showPreview && <PreviewCompiledPrompt />}
                        </div>

                        <div className="fixed bottom-0 left-0 right-0 border-t border-line bg-surface px-6 py-3 z-40">
                            <div className="max-w-3xl mx-auto flex items-center justify-between gap-4">
                                <span className="text-[13px] text-graphite">Everything above goes into the final prompt.</span>
                                <button type="button" className="btn btn-primary" onClick={handleGenerate} disabled={generating}>
                                    {generating ? <><LIcon name="loader-2" className="w-4 h-4 animate-spin" /> Building…</> : <>Build prompt <LIcon name="arrow-right" className="w-4 h-4" /></>}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col h-[calc(100vh-3.5rem)] bg-canvas">
                    <header className="shrink-0 bg-surface border-b border-line px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3 z-20">
                        <div className="flex items-center gap-3 min-w-0">
                            <h1 className="text-[16px] font-semibold text-ink truncate">
                                {data.companyName ? `${data.companyName} agent` : 'Build your agent'}
                            </h1>
                            <span className={`text-[11px] px-2 py-0.5 rounded-full font-medium ${data.callDirection === 'Inbound' ? 'bg-blue-50 text-blue-700' : 'bg-purple-50 text-purple-700'}`}>{data.callDirection}</span>
                        </div>
                        <div className="flex items-center gap-5">
                            <div className="hidden sm:flex items-center gap-2.5 text-[13px]">
                                <span className="font-medium text-ink tabular-nums">{progress}%</span>
                                <div className="w-28 h-2 bg-subtle rounded-full overflow-hidden">
                                    <div className="h-full bg-success transition-all duration-300" style={{ width: `${Math.min(100, progress)}%` }} />
                                </div>
                            </div>
                            <button type="button" className="btn btn-primary" onClick={handleSubmitForm} disabled={evaluating}>
                                {evaluating ? <><LIcon name="loader-2" className="w-4 h-4 animate-spin" /> Reviewing…</> : <>Submit for review <LIcon name="arrow-right" className="w-4 h-4" /></>}
                            </button>
                        </div>
                    </header>

                    <div className="flex-1 flex min-h-0">
                        <nav aria-label="Builder sections" className="hidden md:block w-64 shrink-0 border-r border-line p-4 overflow-y-auto">
                            <div className="space-y-1">
                                {completions.map(({ id, status }, idx) => (
                                    <button key={id} type="button"
                                        className={`flex w-full items-center gap-2.5 rounded-md px-2.5 py-2 text-left text-[13px] font-medium transition-colors ${activeModule === id ? 'bg-subtle text-ink' : 'text-graphite hover:bg-subtle hover:text-ink'
                                            }`}
                                        onClick={() => setActiveModule(id)}>
                                        <StepDot status={status} index={idx + 1} />
                                        <LIcon name={MODULES[id].icon} className="w-4 h-4 shrink-0" />
                                        <span className="truncate">{MODULES[id].nav}</span>
                                    </button>
                                ))}
                            </div>
                        </nav>

                        <main className="flex-1 overflow-y-auto p-4 sm:p-8 min-w-0">
                            <div className="max-w-3xl mx-auto">
                                <div className="md:hidden mb-4">
                                    <div className="flex items-center justify-between mb-2">
                                        <span className="text-[13px] font-medium text-ink">Step {MODULE_ORDER.indexOf(activeModule) + 1} of {MODULE_ORDER.length}</span>
                                        <span className="text-[13px] text-graphite">{Math.min(100, progress)}% complete</span>
                                    </div>
                                    <div className="w-full h-2 bg-subtle rounded-full overflow-hidden">
                                        <div className="h-full bg-success transition-all duration-300" style={{ width: `${Math.min(100, progress)}%` }} />
                                    </div>
                                </div>

                                <div className="md:hidden flex gap-2 overflow-x-auto pb-3 mb-4 -mx-1 px-1 relative">
                                    {completions.map(({ id, status }, idx) => (
                                        <button key={id} type="button" onClick={() => setActiveModule(id)}
                                            className={`shrink-0 inline-flex items-center gap-2 px-3 py-1.5 rounded-lg text-[13px] font-medium border transition-colors ${activeModule === id ? 'border-ink bg-surface text-ink' : 'border-line bg-transparent text-graphite'
                                                }`}>
                                            <StepDot status={status} index={idx + 1} />
                                            {MODULES[id].nav}
                                        </button>
                                    ))}
                                    <div className="absolute right-0 top-0 bottom-0 w-8 bg-gradient-to-l from-canvas to-transparent pointer-events-none" />
                                </div>

                                <PersonaCard data={data} />

                                {gaps.length > 0 && (
                                    <div className="card mb-6 border-warning/30 bg-warning-soft p-4">
                                        <p className="flex items-center gap-2 text-[13px] font-semibold text-warning mb-2">
                                            <LIcon name="alert-triangle" className="w-4 h-4" /> Fill these in before submitting
                                        </p>
                                        <ul className="space-y-1 text-[13px] text-ink-soft list-disc pl-5">
                                            {gaps.map((g) => <li key={g}>{g}</li>)}
                                        </ul>
                                    </div>
                                )}

                                <BuilderForm data={data} setData={setData} activeModule={activeModule} setActiveModule={setActiveModule} validationErrors={validationErrors} setValidationErrors={setValidationErrors} />
                            </div>
                        </main>
                    </div>

                    {stage === 'questions' && (
                        <div className="fixed inset-0 z-50 bg-ink/30 flex items-center justify-center p-4" role="dialog" aria-modal="true">
                            <div className="max-h-[88vh] w-full max-w-2xl overflow-y-auto rounded-lg border border-line bg-surface p-6 shadow-lg sm:p-8">
                                <div className="flex items-start gap-3 mb-6">
                                    <div>
                                        <h3 className="text-[16px] font-semibold text-ink">A few clarifying questions</h3>
                                        <p className="text-[13px] text-graphite">
                                            The reviewer found {questions.length} thing{questions.length === 1 ? '' : 's'} worth pinning down. Answer what you can — blanks are fine.
                                        </p>
                                    </div>
                                </div>
                                <div className="space-y-5">
                                    {questions.map((q, i) => (
                                        <div key={i}>
                                            <label className="block text-[14px] font-medium text-ink mb-1.5">{i + 1}. {q}</label>
                                            <textarea rows={2} className="input-field resize-y" placeholder="Your answer…"
                                                value={answers[i] || ''} onChange={(e) => setAnswers((a) => ({ ...a, [i]: e.target.value }))} />
                                        </div>
                                    ))}
                                </div>
                                <div className="mt-7 flex flex-wrap justify-end gap-2">
                                    <button type="button" className="btn btn-secondary" onClick={() => setStage('form')}>Back to builder</button>
                                    <button type="button" className="btn btn-primary" onClick={() => setStage('review')}>
                                        Continue to review <LIcon name="arrow-right" className="w-4 h-4" />
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
